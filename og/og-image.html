<!--
  Source for og-image.png (1200x630). Regenerate with:
  firefox --headless --window-size=1200,630 --screenshot ../og-image.png "file://$PWD/og-image.html"
  then flatten to RGB (no alpha) before committing.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,500;1,400&family=IBM+Plex+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --desk:#e4dfd2;--paper:#efe9dd;--paper-hi:#fbf8f1;
    --ink:#17161d;--ink-soft:#2b2822;--mute:#67624f;--rule:#d4ccba;
    --accent:#8f2f21;--link:#2a3f8f;
    --serif:'Petrona',Georgia,serif;--mono:'IBM Plex Mono',monospace;
  }
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:var(--desk);color:var(--ink);font-family:var(--serif);padding:28px;-webkit-font-smoothing:antialiased}
  .sheet{position:relative;width:100%;height:100%;background:var(--paper);border:1px solid #cfc7b6;box-shadow:0 1px 0 var(--paper-hi) inset,0 18px 40px -28px rgba(23,22,29,.45);overflow:hidden;display:flex}
  .sheet::before{content:'';position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;background:repeating-linear-gradient(to bottom,transparent 0,transparent 27px,rgba(42,63,143,.07) 27px,rgba(42,63,143,.07) 28px);opacity:.9}
  .sheet::after{content:'';position:absolute;top:0;bottom:0;left:72px;width:1px;background:rgba(143,47,33,.28)}
  .text{position:relative;flex:1 1 auto;padding:44px 40px 40px 104px;display:flex;flex-direction:column}
  .meta{font-family:var(--mono);font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);line-height:1.9}
  .label{font-family:var(--mono);font-size:14px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-top:36px;margin-bottom:14px}
  h1{font-weight:500;font-size:118px;line-height:.94;letter-spacing:-.02em}
  .aka{font-family:var(--mono);font-size:14px;line-height:1.9;color:var(--mute);letter-spacing:.04em;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:8px 0;margin-top:26px;max-width:440px}
  .subtitle{font-size:27px;line-height:1.4;font-style:italic;color:var(--ink-soft);margin-top:auto}
  .plate{position:relative;flex:0 0 auto;width:420px;padding:56px 56px 0 0;display:flex;flex-direction:column;align-items:flex-end}
  .mount{position:relative;width:360px;background:var(--paper-hi);border:1px solid var(--rule);padding:10px;transform:rotate(-1.4deg);box-shadow:0 10px 24px -18px rgba(23,22,29,.7)}
  .mount img{display:block;width:100%;height:auto}
  .mount i{position:absolute;width:22px;height:22px}
  .mount i:first-of-type{top:-1px;left:-1px;border-top:1px solid var(--accent);border-left:1px solid var(--accent)}
  .mount i:last-of-type{bottom:-1px;right:-1px;border-bottom:1px solid var(--accent);border-right:1px solid var(--accent)}
  .caption{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-top:18px;text-align:right}
</style>
</head>
<body>
<div class="sheet">
  <div class="text">
    <div class="meta">Personalkarte · senyaak.work</div>
    <div class="label">Hello, I'm</div>
    <h1>Arsenij<br>Schützer</h1>
    <div class="aka">a.k.a. Schuetzer · Шютцер · Шутцер · senyaak</div>
    <p class="subtitle">Fullstack developer — and more.</p>
  </div>
  <div class="plate">
    <div class="mount"><img src="../avatar-black.png" alt=""><i></i><i></i></div>
    <div class="caption">Abb. 1 — Bradypus, graphite</div>
  </div>
</div>
</body>
</html>
